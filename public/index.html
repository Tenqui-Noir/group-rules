<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>群聊交流与管理规范</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #ececec;
      color: #1f1f1f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #ececec;
    }

    body { overflow-x: hidden; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
      background: rgba(250, 250, 250, .94);
      border-bottom: 1px solid rgba(0, 0, 0, .10);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .title {
      min-width: 0;
      font-size: 15px;
      font-weight: 600;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .page-count {
      min-width: 58px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: #666;
    }

    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid rgba(0, 0, 0, .14);
      border-radius: 9px;
      background: #fff;
      color: #222;
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
    }

    .viewer {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 18px 12px max(28px, env(safe-area-inset-bottom));
    }

    .page {
      position: relative;
      width: min(100%, 920px);
      margin: 0 auto 18px;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .14);
      overflow: hidden;
    }

    .page canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }

    .page-number {
      position: absolute;
      right: 8px;
      bottom: 7px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .48);
      color: #fff;
      font-size: 11px;
      opacity: 0;
      transition: opacity .15s ease;
      pointer-events: none;
    }

    .page:hover .page-number { opacity: 1; }

    .status {
      display: grid;
      place-items: center;
      min-height: 45vh;
      padding: 28px 18px;
      color: #666;
      text-align: center;
      line-height: 1.7;
    }

    .status[hidden] { display: none; }

    .status a { color: inherit; }

    @media (max-width: 560px) {
      .toolbar { grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
      .title { font-size: 14px; }
      .page-count { min-width: 48px; }
      .download { padding: 0 10px; }
      .viewer { padding: 10px 0 max(20px, env(safe-area-inset-bottom)); }
      .page { width: 100%; margin-bottom: 10px; box-shadow: none; }
    }

    @media (prefers-color-scheme: dark) {
      :root, html, body { background: #202124; color: #eee; }
      .toolbar {
        background: rgba(37, 38, 40, .94);
        border-bottom-color: rgba(255, 255, 255, .12);
      }
      .page-count, .status { color: #aaa; }
      .download {
        border-color: rgba(255, 255, 255, .16);
        background: #303134;
        color: #eee;
      }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="title">群聊交流与管理规范（试行）</div>
    <div class="page-count" id="pageCount">— / —</div>
    <a class="download" href="/rules.pdf" download="群聊交流与管理规范.pdf">下载 PDF</a>
  </header>

  <main>
    <div class="status" id="status">正在加载文档…</div>
    <div class="viewer" id="viewer" aria-label="PDF 文档预览"></div>
  </main>

  <script type="module">
    const PDF_URL = "/rules.pdf";
    const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.2.108/pdf.min.mjs";
    const WORKER_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.2.108/pdf.worker.min.mjs";

    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");
    const pageCount = document.getElementById("pageCount");

    let pdf = null;
    const pageElements = new Map();
    const rendering = new Set();
    const rendered = new Set();
    const visibility = new Map();

    function setError(message) {
      status.hidden = false;
      status.innerHTML = `${message}<br><a href="${PDF_URL}">打开原始 PDF</a>`;
    }

    function updateCurrentPage() {
      let bestPage = 1;
      let bestRatio = -1;
      for (const [page, ratio] of visibility) {
        if (ratio > bestRatio) {
          bestPage = page;
          bestRatio = ratio;
        }
      }
      if (pdf) pageCount.textContent = `${bestPage} / ${pdf.numPages}`;
    }

    async function renderPage(pageNumber) {
      if (!pdf || rendering.has(pageNumber) || rendered.has(pageNumber)) return;
      const holder = pageElements.get(pageNumber);
      if (!holder) return;

      rendering.add(pageNumber);
      try {
        const page = await pdf.getPage(pageNumber);
        const baseViewport = page.getViewport({ scale: 1 });
        const cssWidth = Math.max(1, holder.clientWidth);
        const cssScale = cssWidth / baseViewport.width;
        const outputScale = Math.min(window.devicePixelRatio || 1, 1.75);
        const renderViewport = page.getViewport({ scale: cssScale * outputScale });

        const canvas = holder.querySelector("canvas");
        canvas.width = Math.floor(renderViewport.width);
        canvas.height = Math.floor(renderViewport.height);
        canvas.style.width = `${Math.floor(baseViewport.width * cssScale)}px`;
        canvas.style.height = `${Math.floor(baseViewport.height * cssScale)}px`;

        const context = canvas.getContext("2d", { alpha: false });
        await page.render({ canvasContext: context, viewport: renderViewport }).promise;
        rendered.add(pageNumber);

        if (pageNumber === 1) status.hidden = true;
      } catch (error) {
        console.error(`Render page ${pageNumber} failed`, error);
      } finally {
        rendering.delete(pageNumber);
      }
    }

    const lazyObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) renderPage(Number(entry.target.dataset.page));
      }
    }, { rootMargin: "1200px 0px", threshold: 0.01 });

    const pageObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        const page = Number(entry.target.dataset.page);
        if (entry.isIntersecting) visibility.set(page, entry.intersectionRatio);
        else visibility.delete(page);
      }
      updateCurrentPage();
    }, { threshold: [0.05, 0.2, 0.4, 0.6, 0.8] });

    try {
      const pdfjsLib = await import(PDFJS_URL);
      pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_URL;
      pdf = await pdfjsLib.getDocument({ url: PDF_URL }).promise;
      pageCount.textContent = `1 / ${pdf.numPages}`;

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
        const page = await pdf.getPage(pageNumber);
        const viewport = page.getViewport({ scale: 1 });

        const holder = document.createElement("section");
        holder.className = "page";
        holder.dataset.page = String(pageNumber);
        holder.style.aspectRatio = `${viewport.width} / ${viewport.height}`;
        holder.setAttribute("aria-label", `第 ${pageNumber} 页`);

        const canvas = document.createElement("canvas");
        const label = document.createElement("div");
        label.className = "page-number";
        label.textContent = String(pageNumber);

        holder.append(canvas, label);
        viewer.append(holder);
        pageElements.set(pageNumber, holder);
        lazyObserver.observe(holder);
        pageObserver.observe(holder);
      }

      renderPage(1);
    } catch (error) {
      console.error("PDF load failed", error);
      setError("文档预览加载失败。你仍可以直接打开原始 PDF。 ");
    }
  </script>
</body>
</html>
