<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>群聊交流与管理规范</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:#ececec;
      color:#1f1f1f;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#ececec}
    body{overflow-x:hidden}
    .toolbar{
      position:sticky;top:0;z-index:20;
      display:grid;grid-template-columns:minmax(0,1fr) auto auto;
      align-items:center;gap:8px;min-height:56px;
      padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
      background:rgba(250,250,250,.94);
      border-bottom:1px solid rgba(0,0,0,.10);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    }
    .title{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:15px;font-weight:600}
    .page-count{min-width:58px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;color:#666}
    .download{
      display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 11px;
      border:1px solid rgba(0,0,0,.14);border-radius:9px;background:#fff;color:#222;
      text-decoration:none;font-size:13px;white-space:nowrap;
    }
    .viewer{width:100%;max-width:1000px;margin:0 auto;padding:18px 12px max(28px,env(safe-area-inset-bottom))}
    .page{
      position:relative;width:min(100%,920px);margin:0 auto 18px;background:#fff;
      box-shadow:0 2px 12px rgba(0,0,0,.14);overflow:hidden;
    }
    .page img{display:block;width:100%;height:auto;background:#fff}
    .status{display:grid;place-items:center;min-height:45vh;padding:28px 18px;color:#666;text-align:center;line-height:1.8}
    .status[hidden]{display:none}
    .status a{color:inherit}
    .error-detail{display:block;max-width:760px;margin-top:10px;font-size:11px;opacity:.65;word-break:break-all}
    @media(max-width:560px){
      .toolbar{gap:7px}.title{font-size:14px}.page-count{min-width:48px}.download{padding:0 9px}
      .viewer{padding:10px 0 max(20px,env(safe-area-inset-bottom))}.page{width:100%;margin-bottom:10px;box-shadow:none}
    }
    @media(prefers-color-scheme:dark){
      :root,html,body{background:#202124;color:#eee}
      .toolbar{background:rgba(37,38,40,.94);border-bottom-color:rgba(255,255,255,.12)}
      .page-count,.status{color:#aaa}.download{border-color:rgba(255,255,255,.16);background:#303134;color:#eee}
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="title">群聊交流与管理规范（试行）</div>
    <div class="page-count" id="pageCount">— / —</div>
    <a class="download" href="/rules.pdf" download="群聊交流与管理规范.pdf">下载 PDF</a>
  </header>

  <main>
    <div class="status" id="status">正在加载文档预览…</div>
    <div class="viewer" id="viewer" aria-label="群聊交流与管理规范预览"></div>
  </main>

  <script>
    (function(){
      var viewer=document.getElementById('viewer');
      var status=document.getElementById('status');
      var pageCount=document.getElementById('pageCount');
      var total=0;
      var visible={};

      function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
      function showError(e){
        var msg=e&&e.message?e.message:String(e||'未知错误');
        status.hidden=false;
        status.innerHTML='文档预览暂不可用。<br><a href="/rules.pdf">打开原始 PDF</a><span class="error-detail">'+esc(msg)+'</span>';
      }
      function updateCurrent(){
        if(!total)return;
        var best=1,ratio=-1;
        Object.keys(visible).forEach(function(k){if(visible[k]>ratio){best=Number(k);ratio=visible[k]}});
        pageCount.textContent=best+' / '+total;
      }
      function loadManifest(){
        return fetch('/rendered/manifest.json?v='+Date.now(),{cache:'no-store'}).then(function(r){
          if(!r.ok)throw new Error('预览图片仍在生成中（HTTP '+r.status+'）');
          return r.json();
        });
      }
      function start(){
        loadManifest().then(function(manifest){
          if(!manifest||!Array.isArray(manifest.pages)||!manifest.pages.length)throw new Error('预览清单为空');
          total=manifest.pageCount||manifest.pages.length;
          pageCount.textContent='1 / '+total;

          manifest.pages.forEach(function(item,index){
            var section=document.createElement('section');
            section.className='page';
            section.setAttribute('data-page',String(item.page||index+1));
            if(item.width&&item.height)section.style.aspectRatio=item.width+' / '+item.height;

            var img=document.createElement('img');
            img.src='/rendered/'+encodeURIComponent(item.file);
            img.alt='第 '+(item.page||index+1)+' 页';
            img.decoding='async';
            img.loading=index<2?'eager':'lazy';
            img.fetchPriority=index===0?'high':'auto';
            section.appendChild(img);
            viewer.appendChild(section);
          });

          status.hidden=true;

          if('IntersectionObserver' in window){
            var observer=new IntersectionObserver(function(entries){
              entries.forEach(function(entry){
                var p=Number(entry.target.getAttribute('data-page'));
                if(entry.isIntersecting)visible[p]=entry.intersectionRatio;else delete visible[p];
              });
              updateCurrent();
            },{threshold:[.05,.2,.4,.6,.8]});
            Array.prototype.forEach.call(document.querySelectorAll('.page'),function(el){observer.observe(el)});
          }
        }).catch(function(e){
          showError(e);
          var retries=0;
          var timer=setInterval(function(){
            retries++;
            if(retries>12){clearInterval(timer);return}
            loadManifest().then(function(){clearInterval(timer);location.reload()}).catch(function(){})
          },10000);
        });
      }
      start();
    })();
  </script>
</body>
</html>
